<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QTP StratIQ | Professional Suite</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0a0f1d] text-gray-100 min-h-screen">
    <div class="max-w-4xl mx-auto px-6 py-12">
        <h1 class="text-3xl font-bold text-neoncyan mb-8">QTP StratIQ Pro Suite</h1>
        
        <form id="proForm" class="bg-[#111827] p-8 rounded-2xl border border-gray-800 space-y-6">
            <!-- Platform & Logic -->
            <div class="grid grid-cols-2 gap-4">
                <select id="targetPlatform" class="bg-[#0a0f1d] border border-gray-800 p-3 rounded-lg">
                    <option value="mql5">MetaTrader 5 (MQL5)</option>
                    <option value="pine">TradingView (Pine v6)</option>
                </select>
                <select id="strategyType" class="bg-[#0a0f1d] border border-gray-800 p-3 rounded-lg">
                    <option value="ema">EMA Crossover</option>
                    <option value="smc">Smart Money Concepts</option>
                </select>
            </div>

            <!-- Advanced Inputs -->
            <div class="grid grid-cols-3 gap-4">
                <input type="number" id="riskPercent" placeholder="Risk %" class="bg-[#0a0f1d] border border-gray-800 p-3 rounded-lg">
                <input type="number" id="fastMa" placeholder="Fast EMA" class="bg-[#0a0f1d] border border-gray-800 p-3 rounded-lg">
                <input type="number" id="slowMa" placeholder="Slow EMA" class="bg-[#0a0f1d] border border-gray-800 p-3 rounded-lg">
            </div>

            <button type="submit" class="w-full py-4 bg-gradient-to-r from-cyan-500 to-yellow-500 text-black font-bold rounded-xl">
                Generate Professional System
            </button>
        </form>

        <pre id="output" class="mt-8 bg-black p-6 rounded-lg text-cyan-400 text-xs overflow-x-auto border border-gray-800 hidden"></pre>
    </div>

    <script>
        document.getElementById('proForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                platform: document.getElementById('targetPlatform').value,
                logic: document.getElementById('strategyType').value,
                risk: document.getElementById('riskPercent').value,
                fast: document.getElementById('fastMa').value,
                slow: document.getElementById('slowMa').value
            };
            const res = await fetch('/api/translate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            const out = document.getElementById('output');
            out.textContent = data.generated_code;
            out.classList.remove('hidden');
        });
    </script>
</body>
</html>
