    <script>
        // In-memory data store for live bots
        let mockBots = [
            { id: 'bot-1', name: 'QTP SPECTATOR v4.2 (XAUUSD)', platform: 'MQL5', status: 'Active', lastPing: '12s ago', pnl: '+$840.00 (2.1R)', trades: [{type: "LONG", entry: "2384.50", exit: "2405.60", r: "+2.1R", time: "14:22"}] },
            { id: 'bot-2', name: 'QTP BREAKBIAS v3.3 (GER30)', platform: 'Pine v6', status: 'Active', lastPing: '45s ago', pnl: '+$580.50 (1.6R)', trades: [{type: "SHORT", entry: "18450.2", exit: "18384.0", r: "+1.6R", time: "13:05"}] }
        ];

        let generatedCodeStore = "";

        // Full Institutional Code Generator Engine
        document.getElementById('proForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const platform = document.getElementById('targetPlatform').value;
            const logic = document.getElementById('strategyType').value;
            const risk = document.getElementById('riskPercent').value;
            const swing = document.getElementById('swingPeriod').value;
            const session = document.getElementById('sessionFilter').value;

            if (platform === 'mql5') {
                generatedCodeStore = `//+------------------------------------------------------------------+\n` +
                                     `//|                                          QTP_StratIQ_Engine.mq5 |\n` +
                                     `//|                                  Copyright 2026, QTP StratIQ     |\n` +
                                     `//|                               https://qtp-strat-iq.vercel.app    |\n` +
                                     `//+------------------------------------------------------------------+\n` +
                                     `#property copyright "Copyright 2026, QTP StratIQ"\n` +
                                     `#property link      "https://qtp-strat-iq.vercel.app"\n` +
                                     `#property version   "4.20"\n` +
                                     `#property strict\n\n` +
                                     `//--- Inputs\n` +
                                     `input double InpRiskPercent     = ${risk};     // Risk Percentage per Trade\n` +
                                     `input int    InpSwingLookback  = ${swing};    // Swing Point Lookback\n` +
                                     `input bool   InpSessionFilter  = ${session === 'yes' ? 'true' : 'false'}; // London/NY Overlap Only\n` +
                                     `input string InpStrategyModel   = "${logic.toUpperCase()}"; // Execution Logic\n\n` +
                                     `//--- Global Variables\n` +
                                     `ulong        g_magic_no        = 777231;\n` +
                                     `datetime     g_last_bar_time   = 0;\n\n` +
                                     `//+------------------------------------------------------------------+\n` +
                                     `//| Expert initialization function                                   |\n` +
                                     `//+------------------------------------------------------------------+\n` +
                                     `int OnInit() {\n` +
                                     `   Print(">>> QTP StratIQ Engine Initialized Successfully.");\n` +
                                     `   Print(">>> Target Strategy Model: ", InpStrategyModel);\n` +
                                     `   return(INIT_SUCCEEDED);\n` +
                                     `}\n\n` +
                                     `//+------------------------------------------------------------------+\n` +
                                     `//| Expert tick function                                             |\n` +
                                     `//+------------------------------------------------------------------+\n` +
                                     `void OnTick() {\n` +
                                     `   if(!CheckNewBar()) return;\n` +
                                     `   if(InpSessionFilter && !CheckSessionTime()) return;\n\n` +
                                     `   // Core Institutional Execution Logic\n` +
                                     `   bool structure_shift = DetectMarketStructure();\n` +
                                     `   if(structure_shift) {\n` +
                                     `      Print(">>> Institutional Market Structure Shift Detected. Executing Order...");\n` +
                                     `      ExecuteTradeOrder();\n` +
                                     `   }\n` +
                                     `}\n\n` +
                                     `bool CheckNewBar() {\n` +
                                     `   datetime current_bar_time = (datetime)SeriesInfoInteger(_Symbol, _Period, SERIES_LASTBAR_DATE);\n` +
                                     `   if(current_bar_time != g_last_bar_time) {\n` +
                                     `      g_last_bar_time = current_bar_time;\n` +
                                     `      return true;\n` +
                                     `   }\n` +
                                     `   return false;\n` +
                                     `}\n\n` +
                                     `bool CheckSessionTime() {\n` +
                                     `   MqlDateTime dt;\n` +
                                     `   TimeToStruct(TimeCurrent(), dt);\n` +
                                     `   // Active during London/New York window (7:00 to 17:00 UTC equivalent)\n` +
                                     `   if(dt.hour >= 7 && dt.hour <= 17) return true;\n` +
                                     `   return false;\n` +
                                     `}\n\n` +
                                     `bool DetectMarketStructure() {\n` +
                                     `   // Evaluates swing highs/lows based on lookback period\n` +
                                     `   double high_val = iHigh(_Symbol, _Period, iHighest(_Symbol, _Period, MODE_HIGH, InpSwingLookback, 1));\n` +
                                     `   double low_val  = iLow(_Symbol, _Period, iLowest(_Symbol, _Period, MODE_LOW, InpSwingLookback, 1));\n` +
                                     `   return (Close[1] > high_val || Close[1] < low_val);\n` +
                                     `}\n\n` +
                                     `void ExecuteTradeOrder() {\n` +
                                     `   // Order routing and risk-based sizing calculation placeholder\n` +
                                     `   Print("Risk sizing calculated at: ", InpRiskPercent, "%%");\n` +
                                     `}`;
            } else if (platform === 'webhook') {
                generatedCodeStore = `{\n` +
                                     `  "system": "QTP StratIQ Automated Execution",\n` +
                                     `  "version": "4.2",\n` +
                                     `  "timestamp": "${new Date().toISOString()}",\n` +
                                     `  "parameters": {\n` +
                                     `    "methodology": "${logic.toUpperCase()}",\n` +
                                     `    "risk_percent": ${risk},\n` +
                                     `    "swing_lookback": ${swing},\n` +
                                     `    "session_filter": ${session === 'yes'}\n` +
                                     `  },\n` +
                                     `  "action": "EVALUATE_BREAKOUT"\n` +
                                     `}`;
            } else {
                generatedCodeStore = `// @version=6\n` +
                                     `strategy("QTP StratIQ Institutional Suite", overlay=true, initial_capital=10000, default_qty_type=strategy.percent_of_equity, default_qty_value=${risk})\n\n` +
                                     `// --- Inputs & Configurations\n` +
                                     `i_lookback   = input.int(${swing}, title="Swing Lookback Period")\n` +
                                     `i_model      = input.string("${logic.toUpperCase()}", title="Strategy Methodology")\n` +
                                     `i_useSession = input.bool(${session === 'yes'}, title="London/NY Session Filter")\n\n` +
                                     `// --- Core Calculations & SMC Structure Detection\n` +
                                     `highestHigh = ta.highest(high, i_lookback)\n` +
                                     `lowestLow   = ta.lowest(low, i_lookback)\n\n` +
                                     `isBOS_Bull  = ta.crossover(close, highestHigh[1])\n` +
                                     `isBOS_Bear  = ta.crossunder(close, lowestLow[1])\n\n` +
                                     `inSession   = not i_useSession or (time(timeframe.period, "0700-1700:1234567") != 0)\n\n` +
                                     `// --- Execution Triggers\n` +
                                     `if (inSession and isBOS_Bull)\n` +
                                     `    strategy.entry("QTP Long", strategy.long)\n` +
                                     `    label.new(bar_index, low, "SMC Bullish BOS", color=color.new(#00f2fe, 20), textcolor=color.black)\n\n` +
                                     `if (inSession and isBOS_Bear)\n` +
                                     `    strategy.entry("QTP Short", strategy.short)\n` +
                                     `    label.new(bar_index, high, "SMC Bearish BOS", color=color.new(#f87171, 20), textcolor=color.white)`;
            }

            openCodeModal();
        });

        // Modal Controls
        function openCodeModal() {
            document.getElementById('modalOutput').textContent = generatedCodeStore;
            document.getElementById('codeModal').classList.remove('hidden');
        }

        function closeCodeModal() {
            document.getElementById('codeModal').classList.add('hidden');
        }

        function copyModalCode() {
            navigator.clipboard.writeText(generatedCodeStore).then(() => {
                const btn = document.getElementById('modalCopyBtn');
                btn.textContent = '✅ Copied!';
                setTimeout(() => btn.textContent = '📋 Copy Code', 2000);
            });
        }

        // Render Telemetry & Kill Switches
        function renderTelemetry() {
            const botsContainer = document.getElementById('botsContainer');
            botsContainer.innerHTML = '<div style="font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase;">Deployed System Instances & Kill Switches</div>';
            
            let activeCount = 0;
            let tradeLogHtml = '';

            mockBots.forEach(bot => {
                if (bot.status === 'Active') activeCount++;
                const isPaused = bot.status === 'Paused';
                const statusBadgeClass = isPaused ? 'badge badge-red' : 'badge badge-green';
                const btnText = isPaused ? '▶ Resume' : '⏹ Kill Switch';
                const btnKillClass = isPaused ? 'btn-kill paused' : 'btn-kill active';

                const cardHTML = `
                    <div class="bot-instance">
                        <div>
                            <div style="display: flex; align-items: center; gap: 8px;">
                                <span style="font-size: 12px; font-weight: bold; color: #fff;">${bot.name}</span>
                                <span class="badge badge-cyan">${bot.platform}</span>
                                <span class="${statusBadgeClass}">${bot.status}</span>
                            </div>
                            <div style="font-size: 11px; color: var(--text-muted); margin-top: 4px;">Last Ping: ${bot.lastPing} | PnL: ${bot.pnl}</div>
                        </div>
                        <button type="button" onclick="toggleBot('${bot.id}')" class="${btnKillClass}">${btnText}</button>
                    </div>
                `;
                botsContainer.innerHTML += cardHTML;

                if (bot.trades && bot.trades.length > 0) {
                    bot.trades.forEach(t => {
                        tradeLogHtml += `
                            <tr>
                                <td style="font-family: monospace; color: var(--text-muted);">${t.time}</td>
                                <td><span class="badge badge-green">${t.type}</span></td>
                                <td style="font-family: monospace;">${t.entry}</td>
                                <td style="font-family: monospace;">${t.exit}</td>
                                <td style="text-align: right; font-weight: bold; color: #4ade80;">${t.r}</td>
                            </tr>
                        `;
                    });
                }
            });

            document.getElementById('activeBotsCount').textContent = `${activeCount} / ${mockBots.length}`;
            if (tradeLogHtml) {
                document.getElementById('tradeLogBody').innerHTML = tradeLogHtml;
            }
        }

        function toggleBot(id) {
            const bot = mockBots.find(b => b.id === id);
            if (bot) {
                bot.status = bot.status === 'Active' ? 'Paused' : 'Active';
                renderTelemetry();
            }
        }

        // Generate Report Handler
        function generateReport() {
            document.getElementById('resWinRate').textContent = document.getElementById('backtestWinRate').value + '%';
            document.getElementById('resProfitFactor').textContent = document.getElementById('backtestProfitFactor').value;
            document.getElementById('resMaxDD').textContent = document.getElementById('backtestMaxDD').value + '%';
            document.getElementById('resReturn').textContent = '+' + document.getElementById('backtestReturn').value + '%';
            document.getElementById('resBenchmarkName').textContent = document.getElementById('benchmarkAsset').value;
            
            const now = new Date();
            document.getElementById('reportDate').textContent = now.toISOString().split('T')[0] + ' ' + now.toTimeString().split(' ')[0];
            
            document.getElementById('pdfReportContainer').classList.remove('hidden');
            document.getElementById('pdfReportContainer').scrollIntoView({ behavior: 'smooth' });
        }

        // Initialize on load
        window.onload = function() {
            renderTelemetry();
        };
    </script>
