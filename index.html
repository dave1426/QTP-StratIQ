<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QTP StratIQ | Professional Suite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#0a0f1d',
                        cardbg: '#111827',
                        neoncyan: '#00f2fe',
                        neongold: '#ffd700',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-darkbg text-gray-100 min-h-screen antialiased">
    <div class="max-w-3xl mx-auto px-4 py-10">
        
        <!-- Header Branding & Auth Status -->
        <div class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-3xl font-extrabold tracking-wider bg-gradient-to-r from-neoncyan to-white bg-clip-text text-transparent">
                    QTP STRAT<span class="text-neongold">IQ</span>
                </h1>
                <p class="text-xs text-gray-400 mt-1 uppercase tracking-widest">Professional Strategy Automation Suite</p>
            </div>
            <div id="authContainer">
                <button id="loginBtn" onclick="loginWithGoogle()" class="px-4 py-2 bg-gray-800 hover:bg-gray-700 text-neoncyan text-xs font-semibold rounded-xl border border-gray-700 transition cursor-pointer">
                    🔐 Sign In / Register
                </button>
            </div>
        </div>
        
        <!-- Main Form Card (Gated) -->
        <div id="gatedContent" class="hidden">
            <form id="proForm" class="bg-cardbg p-6 sm:p-8 rounded-2xl border border-gray-800 shadow-2xl space-y-6">
                
                <!-- Platform & Logic Selectors -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 uppercase mb-2">Target Platform</label>
                        <select id="targetPlatform" class="w-full bg-darkbg border border-gray-700 rounded-xl p-3 text-white text-sm focus:border-neoncyan outline-none">
                            <option value="mql5">MetaTrader 5 (MQL5)</option>
                            <option value="pine">TradingView (Pine v6)</option>
                            <option value="webhook">Webhook JSON Payload</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 uppercase mb-2">Strategy Methodology</label>
                        <select id="strategyType" onchange="toggleMethodologyInputs()" class="w-full bg-darkbg border border-gray-700 rounded-xl p-3 text-white text-sm focus:border-neoncyan outline-none">
                            <option value="smc">Smart Money Concepts (SMC)</option>
                            <option value="ema">EMA Crossover</option>
                        </select>
                    </div>
                </div>

                <!-- Parameters Grid -->
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 uppercase mb-2">Risk %</label>
                        <input type="number" id="riskPercent" value="1.0" step="0.1" class="w-full bg-darkbg border border-gray-700 rounded-xl p-3 text-white text-sm focus:border-neoncyan outline-none">
                    </div>
                    
                    <!-- SMC Specific Input -->
                    <div id="smcInputs">
                        <label class="block text-xs font-semibold text-gray-400 uppercase mb-2">Swing Lookback</label>
                        <input type="number" id="swingPeriod" value="10" class="w-full bg-darkbg border border-gray-700 rounded-xl p-3 text-white text-sm focus:border-neoncyan outline-none">
                    </div>

                    <!-- EMA Specific Inputs (Hidden by default) -->
                    <div id="emaFastContainer" class="hidden">
                        <label class="block text-xs font-semibold text-gray-400 uppercase mb-2">Fast EMA</label>
                        <input type="number" id="fastMa" value="9" class="w-full bg-darkbg border border-gray-700 rounded-xl p-3 text-white text-sm focus:border-neoncyan outline-none">
                    </div>
                    <div id="emaSlowContainer" class="hidden">
                        <label class="block text-xs font-semibold text-gray-400 uppercase mb-2">Slow EMA</label>
                        <input type="number" id="slowMa" value="21" class="w-full bg-darkbg border border-gray-700 rounded-xl p-3 text-white text-sm focus:border-neoncyan outline-none">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-gray-400 uppercase mb-2">Session Filter</label>
                        <select id="sessionFilter" class="w-full bg-darkbg border border-gray-700 rounded-xl p-3 text-white text-sm focus:border-neoncyan outline-none">
                            <option value="yes">London / NY Overlap</option>
                            <option value="no">24/7 Execution</option>
                        </select>
                    </div>
                </div>

                <!-- Action Button -->
                <button type="submit" class="w-full py-4 bg-gradient-to-r from-neoncyan to-blue-500 text-black font-bold text-sm tracking-wide rounded-xl hover:opacity-90 transition shadow-lg shadow-cyan-500/20 cursor-pointer">
                    Generate Custom System
                </button>
            </form>

            <!-- Output Code Box with Copy Button -->
            <div id="outputContainer" class="mt-8 hidden">
                <div class="flex items-center justify-between mb-2">
                    <label class="block text-xs font-semibold text-neongold uppercase">Compiled System Output:</label>
                    <button id="copyBtn" onclick="copyCode()" class="px-3 py-1 bg-gray-800 hover:bg-gray-700 text-neoncyan text-xs font-semibold rounded-lg border border-gray-700 transition cursor-pointer">
                        📋 Copy Code
                    </button>
                </div>
                <pre id="output" class="bg-black p-4 rounded-xl text-cyan-300 text-xs overflow-x-auto max-h-96 border border-gray-800"></pre>
            </div>
        </div>

        <!-- Public Locked State Banner -->
        <div id="lockedBanner" class="bg-cardbg p-10 rounded-2xl border border-gray-800 text-center space-y-4 shadow-2xl">
            <h3 class="text-xl font-bold text-white">🔒 Institutional Access Required</h3>
            <p class="text-xs text-gray-400 max-w-md mx-auto">Please sign in with your account to unlock the QTP Strategy Builder, backtest parameters, and automated webhook compilation suite.</p>
            <button onclick="loginWithGoogle()" class="px-6 py-3 bg-gradient-to-r from-neoncyan to-blue-500 text-black font-bold text-xs uppercase tracking-wider rounded-xl shadow-lg transition cursor-pointer">
                Sign In to Unlock Generator
            </button>
        </div>
    </div>

    <script>
        // REPLACE THESE WITH YOUR ACTUAL SUPABASE KEYS
        const SUPABASE_URL = 'https://placeholder.supabase.co';
        const SUPABASE_ANON_KEY = 'placeholder-key';
        
        let supabaseClient = null;
        try {
            if (SUPABASE_URL !== 'https://placeholder.supabase.co') {
                supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            }
        } catch (e) {
            console.warn('Supabase not fully configured yet.');
        }

        async function checkUserSession() {
            if (!supabaseClient) return;
            try {
                const { data: { session } } = await supabaseClient.auth.getSession();
                const gatedContent = document.getElementById('gatedContent');
                const lockedBanner = document.getElementById('lockedBanner');
                const authContainer = document.getElementById('authContainer');

                if (session) {
                    gatedContent.classList.remove('hidden');
                    lockedBanner.classList.add('hidden');
                    authContainer.innerHTML = `
                        <div class="flex items-center gap-3">
                            <span class="text-xs text-gray-400 hidden sm:inline">${session.user.email}</span>
                            <button onclick="logout()" class="px-3 py-1.5 bg-gray-800 hover:bg-gray-700 text-red-400 text-xs font-semibold rounded-xl border border-gray-700 transition cursor-pointer">Logout</button>
                        </div>
                    `;
                } else {
                    gatedContent.classList.add('hidden');
                    lockedBanner.classList.remove('hidden');
                }
            } catch (err) {
                console.log('Session check skipped.');
            }
        }

        async function loginWithGoogle() {
            if (!supabaseClient || SUPABASE_URL === 'https://placeholder.supabase.co') {
                alert('Supabase credentials are not configured yet. Please update SUPABASE_URL and SUPABASE_ANON_KEY in your index.html file.');
                return;
            }
            try {
                await supabaseClient.auth.signInWithOAuth({
                    provider: 'google',
                    options: { redirectTo: window.location.origin }
                });
            } catch (err) {
                alert('Authentication error: ' + err.message);
            }
        }

        async function logout() {
            if (!supabaseClient) return;
            await supabaseClient.auth.signOut();
            window.location.reload();
        }

        // Run check on load
        checkUserSession();

        function toggleMethodologyInputs() {
            const strategy = document.getElementById('strategyType').value;
            const smcDiv = document.getElementById('smcInputs');
            const fastDiv = document.getElementById('emaFastContainer');
            const slowDiv = document.getElementById('emaSlowContainer');

            if (strategy === 'ema') {
                smcDiv.classList.add('hidden');
                fastDiv.classList.remove('hidden');
                slowDiv.classList.remove('hidden');
            } else {
                smcDiv.classList.remove('hidden');
                fastDiv.classList.add('hidden');
                slowDiv.classList.add('hidden');
            }
        }

        document.getElementById('proForm')?.addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                platform: document.getElementById('targetPlatform').value,
                logic: document.getElementById('strategyType').value,
                risk: document.getElementById('riskPercent').value,
                swing: document.getElementById('swingPeriod').value,
                fast: document.getElementById('fastMa').value,
                slow: document.getElementById('slowMa').value,
                session: document.getElementById('sessionFilter').value
            };
            
            try {
                const res = await fetch('/api/translate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                const out = document.getElementById('output');
                out.textContent = data.generated_code;
                document.getElementById('outputContainer').classList.remove('hidden');
            } catch (err) {
                alert('Translation error. Please check backend connection.');
            }
        });

        function copyCode() {
            const codeText = document.getElementById('output').textContent;
            navigator.clipboard.writeText(codeText).then(() => {
                const btn = document.getElementById('copyBtn');
                btn.textContent = '✅ Copied!';
                setTimeout(() => {
                    btn.textContent = '📋 Copy Code';
                }, 2000);
            });
        }
    </script>
</body>
</html>
